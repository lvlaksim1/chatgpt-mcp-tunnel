<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChatGPT MCP Tunnel — lifecycle probe</title>
<style>
:root {color-scheme:light dark; font-family:system-ui,"Segoe UI",sans-serif}
body {margin:0;padding:12px;background:transparent;color:var(--color-text-secondary,#777)}
p {font-size:12px;line-height:1.35}
</style>
</head>
<body>
<p role="status" id="status">MCP Tunnel: проверка соединения…</p>
<div style="display:flex;gap:5px;flex-wrap:wrap">
 <button id="test-pip" type="button" disabled>Проверить pip</button>
 <button id="test-fullscreen" type="button" disabled>Проверить fullscreen</button>
 <button id="test-inline" type="button" disabled>Вернуть inline</button>
</div>
<pre role="status" id="capabilities" style="white-space:pre-wrap;font-size:11px"></pre>
<script>
(() => {
  "use strict";
  const mode = "__LIFECYCLE_MODE__";
  const state = document.getElementById("status");
  const instanceId = "ui-" + Math.random().toString(36).slice(2,12) +
    "-" + Date.now().toString(36);
  const pending = new Map();
  let serial = 0, initialized = false, disposed = false, busy = false;
  let lastContext = null, hostCapabilities = null;
  let heartbeat = null;
  const controls = {
    pip:document.getElementById("test-pip"),
    fullscreen:document.getElementById("test-fullscreen"),
    inline:document.getElementById("test-inline")
  };
  const capsText = document.getElementById("capabilities");
  const supported = context => Array.isArray(context?.availableDisplayModes)
    ? context.availableDisplayModes.filter(x => ["inline","fullscreen","pip"].includes(x)) : [];
  const symbol = v => typeof v === "string" ? v.slice(0,45) : "";
  const display = () => {
    const modes = supported(lastContext);
    const caps = hostCapabilities || {};
    capsText.textContent = "Текущий режим: "+(lastContext?.displayMode || "?")+
      "\nДоступные режимы: "+(modes.join(", ") || "host не объявил")+
      "\nui/message: "+Boolean(caps.message?.text)+
      "\nOpenAI message: "+Boolean(caps.experimental?.["openai/message"])+
      "\nSampling: "+Boolean(caps.sampling)+
      "\nTools: "+Boolean(caps.serverTools || caps.tools)+
      "\nПоддержка pip будет проверена запросом, включая отказ.";
  };
  async function probeMode(requested,reason) {
    if (!initialized || disposed) return;
    const advertised=supported(lastContext).includes(requested);
    // This is an isolated conformance probe. Even if pip is NOT advertised,
    // request it once to observe the actual host response. The same test
    // can be repeated via a genuine user click on the diagnostic control.
    await log("tool-call",{source:"display-probe",mode:requested,
      pathKind:advertised?"advertised":"unadvertised"});
    try {
      const result=await request("ui/request-display-mode",{mode:requested});
      if(result?.mode && ["inline","fullscreen","pip"].includes(result.mode))
        lastContext={...lastContext,displayMode:result.mode};
      await log("host-context-changed",{source:"display-result",
        mode:requested,displayMode:symbol(result?.mode || "missing"),
        pathKind:advertised?"advertised":"unadvertised"});
      state.textContent="MCP display: requested "+requested+
        ", resulting "+(result?.mode || "no mode");
    }catch(e) {
      await log("ui-error",{source:"display-request",mode:requested,
        errorCode:symbol(e.message||"failed")});
      state.textContent="MCP display "+requested+": "+symbol(e.message || "error");
    }
    display();
  }
  for (const [mode,button] of Object.entries(controls)) {
    button.addEventListener("click",()=>void probeMode(mode,"button"));
  }

  const bounded = (s) => typeof s === "string" ? s.slice(0,64) : "";
  function request(method, params={}) {
    if (disposed) return Promise.reject(new Error("disposed"));
    const id = ++serial;
    return new Promise((resolve,reject) => {
      const t = setTimeout(() => {
        pending.delete(id); reject(new Error("request_timeout"));
      },12000);
      pending.set(id,{resolve,reject,t});
      window.parent.postMessage({jsonrpc:"2.0",id,method,params},"*");
    });
  }
  async function log(kind,details={}) {
    if (disposed) return false;
    try {
      const r = await request("tools/call", {
        name:"chat.lifecycle.event",
        arguments:{mode,kind,instance_id:instanceId,details_json:JSON.stringify(details)}
      });
      if (r?.isError) throw new Error("tool_is_error");
      return true;
    } catch(e) {
      state.textContent = "Диагностика MCP: " + bounded(e.message);
      return false;
    }
  }
  function extractContext(ctx) {
    return {
      hasDeepLink:!!ctx?.["openai/deepLink"]?.url,
      displayMode:bounded(ctx?.displayMode || ""),
      pathKind:ctx?.["openai/deepLink"]?.url ? "route" : "none"
    };
  }
  function capabilities(caps={}) {
    return {
      hasMessage:!!caps.message?.text,
      hasTools:!!caps.tools,
      hasResources:!!caps.resources,
      hasOpenAiMessage:!!caps.experimental?.["openai/message"],
      hasContextUpdate:!!caps.updateModelContext
    };
  }
  window.addEventListener("message", event => {
    if (event.source !== window.parent) return;
    const msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;
    if (msg.method === "ui/notifications/tool-input") {
      void log("tool-input",{source:"host"});
      return;
    }
    if (msg.method === "ui/notifications/tool-result") {
      void log("tool-result",{source:"host"});
      return;
    }
    if (msg.method === "ui/notifications/host-context-changed") {
      lastContext = {...(lastContext||{}), ...(msg.params||{})};
      display();
      void log("host-context-changed", {...extractContext(lastContext),
        pathKind:supported(lastContext).join(",").slice(0,60)});
      return;
    }
    if (msg.method === "ui/resource-teardown") {
      // Stop the periodic probe, then send the requested teardown reply.
      if (heartbeat !== null) clearInterval(heartbeat);
      if (msg.id !== undefined)
        window.parent.postMessage({jsonrpc:"2.0",id:msg.id,result:{}},"*");
      // Best effort: the host can destroy the iframe immediately afterward.
      void log("teardown",{source:"host"}).finally(() => {disposed=true;});
      return;
    }
    if (!pending.has(msg.id)) return;
    const call = pending.get(msg.id);
    pending.delete(msg.id); clearTimeout(call.t);
    if (msg.error) call.reject(new Error(String(msg.error?.message || "host_error")));
    else call.resolve(msg.result);
  });
  document.addEventListener("visibilitychange", () => {
    void log("visibility-change",{visibility:document.visibilityState === "visible" ? "visible" : "hidden"});
  });
  async function tick() {
    if (!initialized || busy || disposed) return;
    busy = true;
    try { await log("heartbeat",{visibility:document.visibilityState === "visible" ? "visible" : "hidden"}); }
    finally {busy = false;}
  }
  request("ui/initialize", {
    protocolVersion:"2026-01-26",
    appInfo:{name:"ChatGPT MCP Tunnel Lifecycle Pip Probe",version:"0.2.38-test"},
    appCapabilities:{availableDisplayModes:["inline","fullscreen","pip"]}
  }).then(async response => {
    initialized = true;
    lastContext = response?.hostContext || {};
    hostCapabilities = response?.hostCapabilities || {};
    Object.values(controls).forEach(button=>button.disabled=false);
    display();
    window.parent.postMessage({jsonrpc:"2.0",method:"ui/notifications/initialized"},"*");
    await log("ui-initialize",{
      protocol:"2026-01-26",
      host:bounded(response?.hostInfo?.name || "unknown"),
      mode, ...capabilities(response?.hostCapabilities),
      ...extractContext(lastContext),
      pathKind:supported(lastContext).join(",").slice(0,60),
      source:hostCapabilities.sampling?"sampling-yes":"sampling-no"
    });
    await log("ui-initialized",{source:"iframe"});
    state.textContent = "MCP Tunnel: соединение установлено";
    heartbeat = setInterval(tick,7500);
    // Controlled one-off pip probe, without sending any chat message.
    // Do not depend on host announcing pip; record both flags and reply.
    setTimeout(() => {if(!disposed) void probeMode("pip","init");},350);
  }).catch(async e => {
    state.textContent = "MCP Tunnel: " + bounded(e.message);
    await log("ui-error",{errorCode:"initialize_failed"});
  });
})();
</script>
</body>
</html>
