<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChatGPT MCP Tunnel — background hub</title>
<style>:root{color-scheme:light dark;font-family:system-ui,"Segoe UI",sans-serif}
body{margin:0;padding:8px;background:transparent;color:var(--color-text-secondary,#777)}
#status{font-size:11px;margin:0;line-height:1.4}</style></head>
<body><p role="status" id="status">MCP Tunnel: соединение…</p>
<script>
(() => {
 "use strict";
 const mode = "global";
 const status=document.getElementById("status");
 const parent=window.parent;
 const instanceId="hub-"+Math.random().toString(36).slice(2,12)+"-"+Date.now().toString(36);
 const pending=new Map();
 let seq=0,disposed=false;
 function request(method,params={}){
   const id=++seq;
   return new Promise((resolve,reject)=>{
     const timeout=setTimeout(()=>{pending.delete(id);reject(new Error("host_timeout"));},15000);
     pending.set(id,{resolve,reject,timeout});
     parent.postMessage({jsonrpc:"2.0",id,method,params},"*");
   });
 }
 async function log(kind,details={}){
   if(disposed)return;
   try {
     await request("tools/call",{name:"chat.lifecycle.event",arguments:{
       mode:"global",kind,instance_id:instanceId,details_json:JSON.stringify(details)
     }});
   }catch(_){}
 }
 window.addEventListener("message",event=>{
   if(event.source!==parent)return;
   const msg=event.data;
   if(!msg || msg.jsonrpc!=="2.0")return;
   if(msg.method==="ui/notifications/tool-input"){void log("tool-input",{source:"host"});return;}
   if(msg.method==="ui/notifications/tool-result"){void log("tool-result",{source:"host"});return;}
   if(msg.method==="ui/notifications/host-context-changed"){void log("host-context-changed",{source:"host"});return;}
   if(msg.method==="ui/resource-teardown"){
     if(msg.id!==undefined)parent.postMessage({jsonrpc:"2.0",id:msg.id,result:{}},"*");
     void log("teardown",{source:"host"}).finally(()=>{disposed=true;});
     return;
   }
   const call=pending.get(msg.id);
   if(!call)return;
   pending.delete(msg.id);clearTimeout(call.timeout);
   if(msg.error)call.reject(new Error("host_error"));else call.resolve(msg.result);
 });
 request("ui/initialize",{
   protocolVersion:"2026-01-26",
   appInfo:{name:"ChatGPT MCP Tunnel Global Observer",version:"0.2.29"},
   appCapabilities:{availableDisplayModes:["fullscreen","inline"]}
 }).then(async response=>{
   parent.postMessage({jsonrpc:"2.0",method:"ui/notifications/initialized"},"*");
   await log("ui-initialize",{protocol:"2026-01-26",host:"chatgpt",mode:"global",
     hasMessage:!!response?.hostCapabilities?.message?.text});
   await log("ui-initialized",{source:"iframe"});
   status.textContent="MCP Tunnel: Global observer only (no message dispatch)";
 }).catch(()=>{
   status.textContent="MCP Tunnel: Global observer unavailable";
 });
})();
</script></body></html>
