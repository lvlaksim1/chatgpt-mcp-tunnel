name: Build ChatGPT MCP Agent installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable numeric release version (X.Y.Z)'
        required: true
        default: '0.2.5'
        type: string

permissions:
  contents: write

jobs:
  agent-release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ inputs.version }}'
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw 'version must match X.Y.Z' }
          "VERSION=$v" >> $env:GITHUB_ENV
          "TAG=v$v" >> $env:GITHUB_ENV

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate PowerShell launchers and existing tunnel only
        shell: pwsh
        run: |
          $scripts = @(
            'installer/ServerStart.ps1',
            'scripts/Prepare-Clean-Reinstall-DOMKAT.ps1',
            'scripts/Complete-Clean-Reinstall-DOMKAT.ps1'
          )
          foreach ($file in $scripts) {
            $tokens = $null
            $errors = @()
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) { throw "$file has PowerShell syntax errors: $($errors[0])" }
          }
          $launcher = Get-Content installer/ServerStart.ps1 -Raw
          if ($launcher -match 'admin\s+tunnels\s+create|admin\s+tunnels\s+delete') {
            throw 'Server launcher may not create or delete an OpenAI tunnel'
          }
          Write-Host "EXISTING_OPENAI_TUNNEL_ONLY_OK"

      - name: Build self-contained tray application
        shell: pwsh
        run: |
          dotnet publish src/ChatGptMcpAgent/ChatGptMcpAgent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -p:Version=$env:VERSION -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build self-contained Windows execution runtime
        shell: pwsh
        run: |
          dotnet publish src/ChatGptMcpTunnel/ChatGptMcpTunnel.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -p:Version=$env:VERSION -o publish/Runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path publish/Runtime/AutomationWorker.ps1)) { throw 'UI Automation worker missing' }

      - name: Bundle verified official OpenAI tunnel-client v0.0.18
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tools/tunnel-dist, publish/OpenAI | Out-Null
          $release = 'https://github.com/openai/tunnel-client/releases/download/v0.0.18/'
          $archive = 'tunnel-client-v0.0.18-windows-amd64.zip'
          Invoke-WebRequest -Uri ($release + $archive) -OutFile .tools/tunnel-dist/client.zip
          Invoke-WebRequest -Uri ($release + 'SHA256SUMS.txt') -OutFile .tools/tunnel-dist/SHA256SUMS.txt
          $line = Get-Content .tools/tunnel-dist/SHA256SUMS.txt |
            Where-Object { $_ -match [regex]::Escape($archive) + '$' } | Select-Object -First 1
          if (-not $line) { throw 'OpenAI SHA256 manifest is missing the official archive.' }
          $expected = $line.Trim().Substring(0, 64).ToLowerInvariant()
          $actual = (Get-FileHash .tools/tunnel-dist/client.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'OpenAI official tunnel-client archive SHA256 mismatch.' }
          Expand-Archive .tools/tunnel-dist/client.zip -DestinationPath .tools/tunnel-dist/extracted -Force
          $files = Get-ChildItem .tools/tunnel-dist/extracted -Recurse -File
          $client = $files | Where-Object { $_.Name -eq 'tunnel-client.exe' } | Select-Object -First 1
          if (-not $client) { throw 'Official archive does not contain tunnel-client.exe' }
          Copy-Item $client.FullName publish/OpenAI/tunnel-client.exe
          $cloudflared = $files | Where-Object { $_.Name -eq 'cloudflared.exe' } | Select-Object -First 1
          if ($cloudflared) { Copy-Item $cloudflared.FullName publish/OpenAI/cloudflared.exe }
          & publish/OpenAI/tunnel-client.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Official tunnel-client version check failed.' }

      - name: Verify application and runtime without installation
        shell: pwsh
        run: |
          $self = Start-Process -FilePath (Resolve-Path publish/ChatGptMcpAgent.exe) -ArgumentList '--selftest' -Wait -PassThru
          if ($self.ExitCode -ne 0) { throw "Tray DPAPI/config selftest failed: $($self.ExitCode)" }
          New-Item -ItemType Directory -Force -Path .tools | Out-Null
          $env:CHATGPT_MCP_SKIP_GUI_TESTS = '1'
          $secretForms = Start-Process -FilePath (Resolve-Path publish/ChatGptMcpAgent.exe) -ArgumentList '--test-secret-forms' -Wait -PassThru
          if ($secretForms.ExitCode -ne 0) { throw "Client/server secret field UX test failed: $($secretForms.ExitCode)" }
          $appIcon = Start-Process -FilePath (Resolve-Path publish/ChatGptMcpAgent.exe) -ArgumentList '--test-icons' -Wait -PassThru
          if ($appIcon.ExitCode -ne 0) { throw "Embedded Windows tray icon test failed: $($appIcon.ExitCode)" }
          Add-Type -AssemblyName System.Drawing
          $nativeIcon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path publish/ChatGptMcpAgent.exe))
          if ($null -eq $nativeIcon -or $nativeIcon.Width -lt 16) { throw 'The new executable lacks a Windows application icon' }
          $nativeIcon.Dispose()
          $env:CHATGPT_MCP_TEST_DLL = "$pwd\publish\Runtime\ChatGptMcpTunnel.dll"
          python tests/test_mcp_stdio.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_router_lite.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_router_reconnect.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build full and update installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe not found' }
          & $iscc installer/agent-full.iss "/DAppVersion=$env:VERSION" "/DPublishDir=$pwd\publish" "/DOutputDir=$pwd\dist"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $iscc installer/agent-update.iss "/DAppVersion=$env:VERSION" "/DPublishDir=$pwd\publish" "/DOutputDir=$pwd\dist"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test first install, update preservation and uninstall
        shell: pwsh
        run: |
          $defaultClientDir = Join-Path $env:LOCALAPPDATA 'Programs\ChatGPTMCPAgent'
          $expectedServerDir = if (Test-Path 'D:\') { 'D:\ChatGPTMCPAgent' } else { $defaultClientDir }
          $customClientDir = Join-Path $env:LOCALAPPDATA 'Programs\CustomChatGPTMCPClient'
          $exe = Join-Path $expectedServerDir 'ChatGptMcpAgent.exe'
          $runtime = Join-Path $expectedServerDir 'Runtime\ChatGptMcpTunnel.exe'
          $data = Join-Path $env:LOCALAPPDATA 'ChatGPTMCPAgent'
          $setup = "dist\ChatGPT_MCP_Tunnel_Setup_v$env:VERSION.exe"
          $update = "dist\ChatGPT_MCP_Tunnel_Update_v$env:VERSION.exe"
          if (-not (Test-Path $setup) -or -not (Test-Path $update)) { throw 'Installer missing' }
          $first = Start-Process -FilePath (Resolve-Path $setup) -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/ROLE=server','/TASKS=autostart' -PassThru
          if (-not $first.WaitForExit(180000)) { $first.Kill(); throw 'first installer timed out' }
          if ($first.ExitCode -ne 0) { throw "First install failed: $($first.ExitCode)" }
          if (-not (Test-Path $exe) -or -not (Test-Path $runtime)) { throw 'Installed files missing at selected server destination' }
          $installedServerDir = (Get-ItemProperty HKCU:\Software\ChatGPTMCPAgent).InstallDir
          if ($installedServerDir.TrimEnd('\') -ine $expectedServerDir.TrimEnd('\')) { throw "Server default install folder incorrect: $installedServerDir" }
          if (-not (Test-Path (Join-Path $expectedServerDir 'OpenAI\tunnel-client.exe'))) { throw 'Server tunnel-client not bundled' }
          if ((Get-ItemProperty HKCU:\Software\ChatGPTMCPAgent).Role -ne 'server') { throw 'Server role not selected in installer' }
          if (-not (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'ChatGPTMCPAgent' -ErrorAction SilentlyContinue)) { throw 'Autostart checkbox not applied' }
          $check = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw 'Installed agent selftest failed' }
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          Set-Content -Path (Join-Path $data 'preserve.test') -Value 'KEEP'
          $second = Start-Process -FilePath (Resolve-Path $update) -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
          if (-not $second.WaitForExit(180000)) { $second.Kill(); throw 'second installer timed out' }
          if ($second.ExitCode -ne 0) { throw "Update failed: $($second.ExitCode)" }
          if ((Get-Content (Join-Path $data 'preserve.test')) -ne 'KEEP') { throw 'Update removed runtime settings' }
          if ((Get-ItemProperty HKCU:\Software\ChatGPTMCPAgent).Role -ne 'server') { throw 'Update changed selected role' }
          if ((Get-ItemProperty HKCU:\Software\ChatGPTMCPAgent).InstallDir.TrimEnd('\') -ine $expectedServerDir.TrimEnd('\')) { throw 'Update changed selected server folder' }
          if (-not (Test-Path $exe)) { throw 'Update did not retain custom installation destination' }
          $check = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw 'Updated agent selftest failed' }
          $stop = Start-Process -FilePath $exe -ArgumentList '--shutdown' -Wait -PassThru
          if ($stop.ExitCode -ne 0) { throw 'Agent shutdown command failed' }
          $uninstall = Join-Path $expectedServerDir 'unins000.exe'
          $last = Start-Process -FilePath $uninstall -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
          if (-not $last.WaitForExit(180000)) { $last.Kill(); throw 'last installer timed out' }
          if ($last.ExitCode -ne 0) { throw "Uninstall failed: $($last.ExitCode)" }
          if (Test-Path $data) { throw 'Uninstall left application-owned data' }
          if (Test-Path $exe) { throw 'Uninstall left installed executable' }
          $clientInstall = Start-Process -FilePath (Resolve-Path $setup) -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/ROLE=client','/TASKS=desktopicon',("/DIR=$customClientDir") -PassThru
          if (-not $clientInstall.WaitForExit(180000)) { $clientInstall.Kill(); throw 'client installer timeout' }
          if ($clientInstall.ExitCode -ne 0) { throw 'Client role install failed' }
          if ((Get-ItemProperty HKCU:\Software\ChatGPTMCPAgent).Role -ne 'client') { throw 'Client role not selected' }
          $installedClientDir = (Get-ItemProperty HKCU:\Software\ChatGPTMCPAgent).InstallDir
          if ($installedClientDir.TrimEnd('\') -ine $customClientDir.TrimEnd('\')) { throw "User-selected client folder ignored: $installedClientDir" }
          if (-not (Test-Path (Join-Path $customClientDir 'ChatGptMcpAgent.exe'))) { throw 'Client executable not in selected folder' }
          if (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'ChatGPTMCPAgent' -ErrorAction SilentlyContinue) { throw 'Autostart was enabled despite unchecked task' }
          $customUpdate = Start-Process -FilePath (Resolve-Path $update) -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
          if (-not $customUpdate.WaitForExit(180000)) { $customUpdate.Kill(); throw 'custom-folder update timeout' }
          if ($customUpdate.ExitCode -ne 0) { throw "Custom folder update failed: $($customUpdate.ExitCode)" }
          if ((Get-ItemProperty HKCU:\Software\ChatGPTMCPAgent).InstallDir.TrimEnd('\') -ine $customClientDir.TrimEnd('\')) { throw 'Update moved the client from custom folder' }
          if (-not (Test-Path (Join-Path $customClientDir 'ChatGptMcpAgent.exe'))) { throw 'Updated client missing in custom folder' }
          $clientUninstall = Join-Path $customClientDir 'unins000.exe'
          $clientUninstall = Start-Process -FilePath $clientUninstall -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
          if (-not $clientUninstall.WaitForExit(180000)) { $clientUninstall.Kill(); throw 'client uninstall timeout' }
          if ($clientUninstall.ExitCode -ne 0) { throw 'Client role uninstall failed' }
          if (Test-Path (Join-Path $customClientDir 'ChatGptMcpAgent.exe')) { throw 'Custom client uninstall left executable' }
          # A fresh client install without /DIR must suggest the standard C: user installation.
          $defaultClientInstall = Start-Process -FilePath (Resolve-Path $setup) -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/ROLE=client','/TASKS=desktopicon' -PassThru
          if (-not $defaultClientInstall.WaitForExit(180000)) { $defaultClientInstall.Kill(); throw 'default client install timeout' }
          if ($defaultClientInstall.ExitCode -ne 0) { throw 'Default client install failed' }
          $actualClientDefault = (Get-ItemProperty HKCU:\Software\ChatGPTMCPAgent).InstallDir
          if ($actualClientDefault.TrimEnd('\') -ine $defaultClientDir.TrimEnd('\')) { throw "Default client folder incorrect: $actualClientDefault" }
          $defaultClientUninstaller = Join-Path $actualClientDefault 'unins000.exe'
          $defaultClientUninstall = Start-Process -FilePath $defaultClientUninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
          if (-not $defaultClientUninstall.WaitForExit(180000)) { $defaultClientUninstall.Kill(); throw 'default client uninstall timeout' }
          if ($defaultClientUninstall.ExitCode -ne 0) { throw 'Default client uninstall failed' }
          Write-Host "SERVER_D_CLIENT_C_USER_SELECTED_FOLDER_UPDATE_UNINSTALL_OK"

      - name: Publish stable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = "dist\ChatGPT_MCP_Tunnel_Setup_v$env:VERSION.exe"
          $update = "dist\ChatGPT_MCP_Tunnel_Update_v$env:VERSION.exe"
          $legacyUpdate = "dist\ChatGPT_MCP_Agent_Update_v$env:VERSION.exe"
          Copy-Item $update $legacyUpdate
          gh release create $env:TAG $setup $update $legacyUpdate --target "${{ github.sha }}" --title "ChatGPT MCP Tunnel v$env:VERSION" --notes "Единый установщик: выбор роли Сервер/Клиент и автозапуска. Обновление сохраняет роль и настройки. Windows x64. Маршрутизация проверена локально; проверка между двумя физическими компьютерами ожидается."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prune older agent binary releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $list = gh release list --limit 100 --json tagName,name | ConvertFrom-Json
          foreach ($release in $list) {
            if ($release.tagName -ne $env:TAG -and $release.name -like 'ChatGPT MCP Agent v*') {
              gh release delete $release.tagName --yes
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
