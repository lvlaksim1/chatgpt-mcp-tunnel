name: MCP Server Smoke Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-stdio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build standalone MCP server
        run: dotnet build src/ChatGptMcpTunnel/ChatGptMcpTunnel.csproj -c Release --nologo
      - name: Verify MCP initialize, tools/list and tools/call
        run: python3 tests/test_mcp_stdio.py
      - name: Goose restricted MCP test
        run: python3 tests/test_goose_safe_profile.py
      - name: Verify own GitHub MCP tool registration without credentials
        run: python3 tests/test_github_tools.py

  windows-tools:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows MCP server
        run: dotnet build src/ChatGptMcpTunnel/ChatGptMcpTunnel.csproj -c Release --nologo
      - name: Verify all eight Windows tools through MCP
        run: python tests/test_windows_tools.py
      - name: Build Windows tray agent for local STOP tests
        run: dotnet build src/ChatGptMcpAgent/ChatGptMcpAgent.csproj -c Release --nologo
      - name: Verify reused persistent UI Automation worker
        run: python tests/test_uia_worker_persistent.py
      - name: Verify automatic overlay with native HWND visibility
        shell: pwsh
        run: |
          $exe = (Resolve-Path src/ChatGptMcpAgent/bin/Release/net8.0-windows/ChatGptMcpAgent.exe).Path
          foreach ($flag in @('--test-overlay-auto', '--test-overlay-tray')) {
            $p = Start-Process -FilePath $exe -ArgumentList $flag -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Control overlay $flag failed: $($p.ExitCode)" }
          }
      - name: Verify WinForms local STOP and one-second GUI pacing
        shell: pwsh
        run: |
          $exe = (Resolve-Path src/ChatGptMcpAgent/bin/Release/net8.0-windows/ChatGptMcpAgent.exe).Path
          $p = Start-Process -FilePath $exe -ArgumentList '--test-control' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Local STOP test failed: $($p.ExitCode)" }
      - name: Verify resumable file transfer through Router Lite
        run: python tests/test_file_transfer.py
      - name: Goose restricted MCP test on Windows
        run: python tests/test_goose_safe_profile.py
