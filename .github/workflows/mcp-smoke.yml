name: MCP Server Smoke Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-stdio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build standalone MCP server
        run: dotnet build src/ChatGptMcpTunnel/ChatGptMcpTunnel.csproj -c Release --nologo
      - name: Verify MCP initialize, tools/list and tools/call
        run: python3 tests/test_mcp_stdio.py
